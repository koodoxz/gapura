[package]
name = "gapura"
version = "0.1.0"
edition = "2021"
authors = ["koodoxz <contributors@koodoxz.org>"]
description = "High-Performance Ingress Gateway for Encrypted DNS (DoH/DoT/DoQ)"
repository = "https://github.com/koodoxz/gapura"
license = "AGPL-3.0-or-later"

[[bin]]
name = "gapura"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full", "signal"] }

# DNS protocol
trust-dns-proto = "0.23"

# TLS
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"

# QUIC (for DoQ)
quinn = { version = "0.11", features = ["rustls-ring"] }

# HTTP server (for DoH)
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
http-body-util = "0.1"

# Config
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Utils
bytes = "1"
base64 = "0.22"
parking_lot = "0.12"
dashmap = "5"
rand = "0.8"
hex = "0.4"
maxminddb = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
